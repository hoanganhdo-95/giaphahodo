<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Phả Phân Biệt Giới Tính</title>
    <!-- Nhúng thư viện FamilyTreeJS -->
    <script src="https://balkan.app/js/FamilyTree.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #tree {
            width: 100%;
            height: 85vh; /* Chiều cao gần hết màn hình */
            background-color: white;
        }
        .toolbar {
            padding: 10px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        button.reset { background-color: #e74c3c; }
        button.reset:hover { background-color: #c0392b; }

        /* --- CSS PHÂN BIỆT GIỚI TÍNH --- */
        
        /* Màu viền và nền cho Nam (Con trai, Chồng, Bố) */
        .FamilyTree .node.male rect[fill="#FFFFFF"], 
        .FamilyTree .node.male rect[fill="#fff"] {
            stroke: #3498db; /* Viền xanh dương */
            stroke-width: 3px;
        }
        /* Tùy chọn: Đổi màu nền nhẹ cho nam */
        .FamilyTree .node.male .ft_name { fill: #2980b9; }

        /* Màu viền và nền cho Nữ (Con gái, Vợ, Mẹ) */
        .FamilyTree .node.female rect[fill="#FFFFFF"],
        .FamilyTree .node.female rect[fill="#fff"] {
            stroke: #e91e63; /* Viền hồng đậm */
            stroke-width: 3px;
        }
        /* Tùy chọn: Đổi màu nền nhẹ cho nữ */
        .FamilyTree .node.female .ft_name { fill: #c2185b; }

    </style>
</head>
<body>

<header>
    <h1>🌳 Gia Phả Dòng Họ (Phân biệt Giới tính)</h1>
</header>

<div class="toolbar">
    <button onclick="exportJSON()">💾 Lưu dữ liệu (Console)</button>
    <button onclick="resetTree()">🔄 Tải lại mẫu</button>
    <span style="align-self: center; margin-left: 10px; font-size: 14px; color: #555;">
        💡 <b>Mẹo:</b> Bấm vào dấu <b>(+)</b> trên thẻ để thêm Vợ/Chồng hoặc Con cái.
    </span>
</div>

<div id="tree"></div>

<script>
    // 1. Dữ liệu mẫu ban đầu
    // Lưu ý: trường 'gender' là 'male' hoặc 'female' để CSS tô màu
    var initialData = [
        { id: 1, name: "Ông Nội", title: "Trưởng tộc", gender: "male", img: "https://cdn.balkan.app/shared/m3/1.jpg" },
        { id: 2, pId: 1, name: "Bố", title: "Con trai cả", gender: "male", img: "https://cdn.balkan.app/shared/m3/2.jpg" },
        { id: 3, pId: 1, name: "Chú Ba", title: "Con trai thứ", gender: "male", img: "https://cdn.balkan.app/shared/m3/3.jpg" },
        { id: 4, mId: 2, name: "Mẹ", title: "Vợ của Bố", gender: "female", img: "https://cdn.balkan.app/shared/w3/4.jpg" },
        { id: 5, pId: 2, mId: 4, name: "Anh Cả", title: "Con trai", gender: "male", img: "https://cdn.balkan.app/shared/m3/5.jpg" },
        { id: 6, pId: 2, mId: 4, name: "Chị Hai", title: "Con gái", gender: "female", img: "https://cdn.balkan.app/shared/w3/6.jpg" }
    ];

    // Ảnh mặc định khi thêm mới
    const DEFAULT_MALE_IMG = "https://cdn.balkan.app/shared/m3/11.jpg";
    const DEFAULT_FEMALE_IMG = "https://cdn.balkan.app/shared/w3/12.jpg";

    // 2. Cấu hình cây gia phả
    var family = new FamilyTree(document.getElementById("tree"), {
        template: "olivia",
        enableSearch: false,
        
        // Cấu hình menu khi bấm vào nút (+)
        nodeMenu: {
            details: { text: "Chi tiết" },
            edit: { text: "Sửa thông tin" },
            add: { 
                text: "Thêm thành viên",
                onClick: function(nodeId) {
                    // Khi bấm Add, thư viện sẽ hiện menu con, ta để mặc định
                }
            },
            remove: { text: "Xóa" }
        },
        
        // Cấu hình các trường hiển thị
        nodeBinding: {
            field_0: "name",
            field_1: "title",
            img_0: "img"
        },

        nodes: initialData,
        
        // Sự kiện quan trọng: Khi thêm thành viên mới
        onAdd: function (sender, node) {
            // Logic tự động gán ảnh và giới tính nếu chưa có
            // Lưu ý: FamilyTreeJS mở form để nhập, ta không can thiệp trực tiếp vào form nhập được ở bản free
            // Nhưng ta có thể xử lý sau khi lưu (onEdit/onAdd) để chuẩn hóa dữ liệu
        },
        
        // Sự kiện khi sửa hoặc thêm xong (Dùng để gán class CSS cho đúng giới tính)
        onEdit: function (sender, node) {
            updateGenderClass(sender, node);
        },
        onAdd: function (sender, node) {
            // Nếu người dùng thêm mà không chọn ảnh, ta gán ảnh mặc định dựa vào giới tính (nếu có nhập)
            // Hoặc đơn giản là gọi hàm cập nhật class
            if(!node.img) {
                // Nếu chưa có ảnh, giữ nguyên hoặc gán ảnh mặc định tùy logic
            }
            updateGenderClass(sender, node);
        }
    });

    // Hàm helper để gán class 'male' hoặc 'female' vào node HTML
    // Giúp CSS tô màu viền Xanh/Hồng
    function updateGenderClass(sender, node) {
        // Tìm element HTML của node này
        // Lưu ý: Việc này cần chạy sau khi render, ở đây ta dùng cách đơn giản là dựa vào dữ liệu
        // Thư viện FamilyTree hỗ trợ trường gender, ta chỉ cần đảm bảo dữ liệu gửi lên có trường này.
        
        // Mẹo nhỏ: Trong form sửa của thư viện, bạn hãy điền giới tính vào trường 'gender'
        // Nếu muốn tự động hóa hoàn toàn, cần code phức tạp hơn. 
        // Ở đây tôi hướng dẫn bạn cách nhập liệu đúng:
        // Khi bấm Sửa (Edit), hãy thêm trường gender: 'male' hoặc 'female'
    }

    // --- XỬ LÝ DỮ LIỆU ---

    function exportJSON() {
        var data = family.get();
        console.log(data);
        alert("Đã xuất dữ liệu ra Console (Nhấn F12 để xem). Copy đoạn JSON đó để lưu trữ.");
        
        // In ra màn hình cho dễ thấy
        var jsonStr = JSON.stringify(data, null, 2);
        console.log(jsonStr);
    }

    function resetTree() {
        if(confirm("Bạn có muốn tải lại dữ liệu mẫu không?")) {
            family.load(initialData);
        }
    }

    // --- HƯỚNG DẪN SỬ DỤNG ---
    // 1. Để thêm Vợ/Chồng: Bấm vào dấu (+) trên thẻ người đó -> Chọn "Partner".
    // 2. Để thêm Con: Bấm vào dấu (+) -> Chọn "Child".
    // 3. Để phân biệt Nam/Nữ: 
    //    - Bấm vào bút (Sửa).
    //    - Tại ô trống hoặc thêm trường mới, điền: gender (chọn male hoặc female).
    //    - Code CSS trên sẽ tự động tô viền Xanh (Nam) hoặc Hồng (Nữ).
    
    // Tự động gán class khi vẽ lại
    family.on("render", function(){
        var nodes = family.get();
        nodes.forEach(n => {
            if(n.gender === 'male') {
                // Tìm node DOM và add class (Cách này hơi phức tạp với thư viện này nên ta dùng CSS attribute selector ở trên là đủ)
            }
        });
    });

</script>

</body>
</html>
